<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Quick - Smart Business Management</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111827;
}

header{
background:#111827;
color:white;
padding:18px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:14px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,select{
width:100%;
padding:12px;
margin:7px 0;
border:1px solid #d1d5db;
border-radius:8px;
font-size:15px;
}

button{
border:0;
padding:11px 15px;
border-radius:8px;
background:#2563eb;
color:white;
font-size:15px;
margin:5px 3px;
cursor:pointer;
}

button.delete{
background:#dc2626;
}

button.green{
background:#16a34a;
}

button.gray{
background:#4b5563;
}

.hidden{
display:none;
}

.stat{
display:inline-block;
width:30%;
margin:1%;
padding:15px;
background:#eef2ff;
border-radius:10px;
text-align:center;
}

.product,.customer{
border:1px solid #e5e7eb;
padding:12px;
margin:8px 0;
border-radius:9px;
}

.invoice{
border:1px solid #ddd;
padding:18px;
border-radius:10px;
background:#fff;
}

hr{
border:0;
border-top:1px solid #ddd;
margin:18px 0;
}

@media(max-width:600px){
.stat{
width:100%;
margin:5px 0;
}
}
</style>
</head>

<body>

<header>
<h1>Business Quick 🚀</h1>
<p>Smart Business Management</p>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginPage" class="card">
<h2>🔐 Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">🚀 Login to Business Quick</button>
</div>


<!-- APP -->

<div id="app" class="hidden">

<div class="card">
<button onclick="showSection('dashboard')">📊 Dashboard</button>
<button onclick="showSection('products')">📦 Products</button>
<button onclick="showSection('customers')">👤 Customers</button>
<button onclick="showSection('invoice')">🧾 Invoice</button>
<button class="gray" onclick="logout()">Logout</button>
</div>


<!-- DASHBOARD -->

<div id="dashboard" class="section">

<div class="card">
<h2>📊 Business Dashboard</h2>

<div class="stat">
<strong id="productCount">0</strong>
<br>Products
</div>

<div class="stat">
<strong id="customerCount">0</strong>
<br>Customers
</div>

<div class="stat">
<strong id="salesTotal">₹0</strong>
<br>Sales
</div>

<div class="stat">
<strong id="profitTotal">₹0</strong>
<br>Profit
</div>

</div>

</div>


<!-- PRODUCTS -->

<div id="products" class="section hidden">

<div class="card">
<h2>📦 Product Management</h2>

<input id="productName" placeholder="Product name">

<input id="productPrice" type="number" placeholder="Selling price">

<input id="productStock" type="number" placeholder="Stock">

<button onclick="addProduct()">➕ Add Product</button>

<input id="productSearch" placeholder="🔍 Search product" oninput="displayProducts()">

<div id="productList"></div>
</div>

</div>


<!-- CUSTOMERS -->

<div id="customers" class="section hidden">

<div class="card">
<h2>👤 Customer Management</h2>

<input id="customerName" placeholder="Customer name">

<input id="customerPhone" placeholder="Phone number">

<button onclick="addCustomer()">➕ Add New Customer</button>

<div id="customerList"></div>
</div>

</div>


<!-- INVOICE -->

<div id="invoice" class="section hidden">

<div class="card">

<h2>🧾 Invoice Management</h2>

<input id="invoiceCustomer" placeholder="Customer name">

<input id="invoiceProduct" placeholder="Product name">

<input id="invoiceQuantity" type="number" placeholder="Quantity">

<select id="paymentStatus">
<option value="Paid">Paid</option>
<option value="Pending">Pending</option>
</select>

<input id="invoicePrice" type="number" placeholder="Selling price">

<input id="invoiceCost" type="number" placeholder="Cost price">

<button onclick="createInvoice()">🧾 Create Invoice</button>

<div id="invoiceResult"></div>

</div>

</div>

</div>
</div>


<script>

let products =
JSON.parse(localStorage.getItem("products") || "[]");

let customers =
JSON.parse(localStorage.getItem("customers") || "[]");

let sales =
JSON.parse(localStorage.getItem("sales") || "[]");

let currentInvoice = "";


/* LOGIN */

function login(){

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

if(username === "admin" && password === "1234"){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

updateDashboard();

}else{

alert("Wrong username or password");

}

}


/* LOGOUT */

function logout(){

document.getElementById("app")
.classList.add("hidden");

document.getElementById("loginPage")
.classList.remove("hidden");

}


/* SECTIONS */

function showSection(id){

document.querySelectorAll(".section")
.forEach(function(section){

section.classList.add("hidden");

});

document.getElementById(id)
.classList.remove("hidden");

updateDashboard();

}


/* PRODUCT */

function addProduct(){

let name =
document.getElementById("productName").value;

let price =
Number(document.getElementById("productPrice").value);

let stock =
Number(document.getElementById("productStock").value);

if(!name || !price){

alert("Enter product name and price");

return;

}

products.push({
name:name,
price:price,
stock:stock
});

localStorage.setItem(
"products",
JSON.stringify(products)
);

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productStock").value="";

displayProducts();
updateDashboard();

}


/* DISPLAY PRODUCTS */

function displayProducts(){

let search =
document.getElementById("productSearch").value
.toLowerCase();

let html="";

products.forEach(function(product,index){

if(product.name.toLowerCase().includes(search)){

html += `

<div class="product">

<strong>${product.name}</strong>

<br>
Price: ₹${product.price}

<br>
Stock: ${product.stock}

<br>

<button onclick="editProduct(${index})">
✏️ Edit
</button>

<button class="delete"
onclick="deleteProduct(${index})">
🗑️ Delete Product
</button>

</div>

`;

}

});

document.getElementById("productList")
.innerHTML = html;

}


/* EDIT PRODUCT */

function editProduct(index){

let name =
prompt("Product name",products[index].name);

if(name === null) return;

let price =
prompt("Price",products[index].price);

let stock =
prompt("Stock",products[index].stock);

products[index].name=name;
products[index].price=Number(price);
products[index].stock=Number(stock);

localStorage.setItem(
"products",
JSON.stringify(products)
);

displayProducts();

updateDashboard();

}


/* DELETE PRODUCT */

function deleteProduct(index){

if(!confirm("Delete this product?"))
return;

products.splice(index,1);

localStorage.setItem(
"products",
JSON.stringify(products)
);

displayProducts();

updateDashboard();

}


/* CUSTOMER */

function addCustomer(){

let name =
document.getElementById("customerName").value;

let phone =
document.getElementById("customerPhone").value;

if(!name){

alert("Enter customer name");

return;

}

customers.push({
name:name,
phone:phone
});

localStorage.setItem(
"customers",
JSON.stringify(customers)
);

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";

displayCustomers();

updateDashboard();

}


/* DISPLAY CUSTOMERS */

function displayCustomers(){

let html="";

customers.forEach(function(customer,index){

html += `

<div class="customer">

<strong>${customer.name}</strong>

<br>
Phone: ${customer.phone || "N/A"}

<br>

<button class="delete"
onclick="deleteCustomer(${index})">
🗑️ Delete Customer
</button>

</div>

`;

});

document.getElementById("customerList")
.innerHTML=html;

}


/* DELETE CUSTOMER */

function deleteCustomer(index){

if(!confirm("Delete this customer?"))
return;

customers.splice(index,1);

localStorage.setItem(
"customers",
JSON.stringify(customers)
);

displayCustomers();

updateDashboard();

}


/* INVOICE */

function createInvoice(){

let customer =
document.getElementById("invoiceCustomer").value;

let product =
document.getElementById("invoiceProduct").value;

let quantity =
Number(document.getElementById("invoiceQuantity").value);

let paymentStatus =
document.getElementById("paymentStatus").value;

let price =
Number(document.getElementById("invoicePrice").value);

let cost =
Number(document.getElementById("invoiceCost").value);

if(!customer || !product || !quantity || !price){

alert("Please fill required details");

return;

}

let sale =
price * quantity;

let profit =
(price - cost) * quantity;

let invoiceNumber =
"INV-" + Date.now();

let invoiceDate =
new Date().toLocaleDateString("en-IN");


sales.push({

customer:customer,
product:product,
sale:sale,
profit:profit,
status:paymentStatus

});

localStorage.setItem(
"sales",
JSON.stringify(sales)
);


currentInvoice =

"BUSINESS QUICK\n\n"+
"Invoice No: "+invoiceNumber+"\n"+
"Date: "+invoiceDate+"\n\n"+
"Customer: "+customer+"\n"+
"Product: "+product+"\n"+
"Quantity: "+quantity+"\n"+
"Total: ₹"+sale+"\n"+
"Profit: ₹"+profit+"\n"+
"Payment Status: "+paymentStatus;


document.getElementById("invoiceResult")
.innerHTML = `

<div class="invoice">

<h2>BUSINESS QUICK</h2>

<p>Smart Business Management</p>

<hr>

<p>
<strong>Invoice No:</strong>
${invoiceNumber}
</p>

<p>
<strong>Date:</strong>
${invoiceDate}
</p>

<p>
<strong>Customer:</strong>
${customer}
</p>

<p>
<strong>Product:</strong>
${product}
</p>

<p>
<strong>Quantity:</strong>
${quantity}
</p>

<p>
<strong>Total:</strong>
₹${sale}
</p>

<p>
<strong>Profit:</strong>
₹${profit}
</p>

<p>
<strong>Payment Status:</strong>
${paymentStatus}
</p>

<hr>

<p style="text-align:center;">
<strong>Thank you for your business! 🙏</strong>
</p>

<button onclick="printInvoice()">
🖨️ Print / PDF
</button>

<button class="green"
onclick="copyInvoice()">
📋 Copy Invoice
</button>

<button class="green"
onclick="shareWhatsApp()">
💬 WhatsApp
</button>

</div>

`;

updateDashboard();

}


/* PRINT */

function printInvoice(){

if(!currentInvoice){

alert("Generate an invoice first.");

return;

}

let win =
window.open("","_blank");

if(!win){

alert("Please allow pop-ups.");

return;

}

win.document.write(`

<html>

<head>

<title>Business Quick Invoice</title>

<style>

body{
font-family:Arial;
padding:30px;
}

.invoice{
max-width:650px;
margin:auto;
border:1px solid #ddd;
padding:30px;
}

h1{
margin-bottom:5px;
}

pre{
white-space:pre-wrap;
font-family:Arial;
font-size:16px;
line-height:1.7;
}

</style>

</head>

<body>

<div class="invoice">

<h1>BUSINESS QUICK</h1>

<p>Smart Business Management</p>

<hr>

<pre>${currentInvoice}</pre>

<hr>

<p style="text-align:center;">
<strong>Thank you for your business! 🙏</strong>
</p>

</div>

<script>

window.onload=function(){

window.print();

};

<\/script>

</body>

</html>

`);

win.document.close();

}


/* COPY */

function copyInvoice(){

if(!currentInvoice){

alert("Generate an invoice first.");

return;

}

navigator.clipboard.writeText(currentInvoice);

alert("Invoice copied!");

}


/* WHATSAPP */

function shareWhatsApp(){

if(!currentInvoice){

alert("Generate an invoice first.");

return;

}

navigator.clipboard.writeText(currentInvoice)
.then(function(){

alert(
"Invoice copied! 📋\n\nOpen WhatsApp and paste the invoice."
);

})
.catch(function(){

alert(
"Please use the Copy Invoice button and paste it in WhatsApp."
);

});

}


/* DASHBOARD */

function updateDashboard(){

document.getElementById("productCount")
.innerText=products.length;

document.getElementById("customerCount")
.innerText=customers.length;

let salesTotal=0;
let profitTotal=0;

sales.forEach(function(item){

salesTotal += Number(item.sale) || 0;

profitTotal += Number(item.profit) || 0;

});

document.getElementById("salesTotal")
.innerText="₹"+salesTotal;

document.getElementById("profitTotal")
.innerText="₹"+profitTotal;

displayProducts();

displayCustomers();

}


/* START */

updateDashboard();

</script>

</body>
</html>
